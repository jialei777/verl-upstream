---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ray-ksa
  namespace: default # Change this if your Ray cluster is in a different namespace
  annotations:
      iam.gke.io/gcp-service-account: ray-tpu-gsa@tpu-pytorch.iam.gserviceaccount.com
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ray-ksa-admin-binding
subjects:
- kind: ServiceAccount
  name: ray-ksa
  namespace: default # Must match the namespace of the ServiceAccount above
roleRef:
  kind: ClusterRole
  name: cluster-admin # Only for testing, should use a more restrictive role in prod
  apiGroup: rbac.authorization.k8s.io
---
# 2 x TPU v6e-32 slices (4x8 topology, 8 hosts x 4 chips each = 64 chips total):
# slice 0 (tpu-group-0) -> TorchTitan trainer, slice 1 (tpu-group-1) -> vLLM rollout.
# Tested on GKE cluster jialeic-v6e32-3s-spot (us-central1, project tpu-pytorch).
apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: ray-tpu-v6e32-cluster
spec:
  headGroupSpec:
    rayStartParams: {}
    template:
      metadata:
        annotations:
          gke-gcsfuse/volumes: "true"
      spec:
        serviceAccountName: ray-ksa
        containers:
          - name: ray-head
            image: us-west2-docker.pkg.dev/tpu-pytorch/raycluster/verl-tpu:v20261006-tsync1006
            imagePullPolicy: Always
            env:
            - name: RAY_TRAIN_V2_ENABLED
              value: "1"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-secret
                  key: hf_token
                  optional: true
            ports:
              - containerPort: 8265  # Dashboard
              - containerPort: 10001 # Client
              - containerPort: 8888  # gRPC
              - containerPort: 8000  # OpenAI API
            resources:
              limits:
                cpu: "12"
                memory: "48Gi"
              requests:
                cpu: "12"
                memory: "48Gi"
            volumeMounts:
            - name: gcs-volume
              mountPath: /data
            - name: host-tmp
              mountPath: /tmp
        volumes:
        - name: gcs-volume
          csi:
            driver: gcsfuse.csi.storage.gke.io
            volumeAttributes:
              bucketName: torchprime
              mountOptions: "implicit-dirs"
        - name: host-tmp
          hostPath:
            path: /tmp
  workerGroupSpecs:
    - replicas: 2 # use 2 slices: 1 trainer + 1 rollout
      numOfHosts: 8 # v6e-32 = 8 hosts x 4 chips
      groupName: tpu-group
      rayStartParams: {}
      template:
        metadata:
          annotations:
            gke-gcsfuse/volumes: "true"
        spec:
          serviceAccountName: ray-ksa
          containers:
            - name: ray-worker
              image: us-west2-docker.pkg.dev/tpu-pytorch/raycluster/verl-tpu:v20261006-tsync1006
              imagePullPolicy: Always
              resources:
                # ct6e-standard-4t hosts have ~179 vCPU / ~687Gi allocatable. Qwen3-32B bf16 weights are
                # ~64 GB, and several processes per host may stage them in host memory, so request more
                # than the v6e-8 manifest's 400Gi.
                limits:
                  memory: "600Gi"
                  # Each Worker node has 4 TPU chips.
                  google.com/tpu: "4"
                requests:
                  cpu: "160"
                  memory: "600Gi"
                  # Each Worker node has 4 TPU chips.
                  google.com/tpu: "4"
              env:
                - name: RAY_TRAIN_V2_ENABLED
                  value: "1"
                - name: RAY_memory_monitor_refresh_ms
                  value: "0"
                - name: RAY_memory_usage_threshold
                  value: "0.99"
                - name: HF_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: hf-secret
                      key: hf_token
                      optional: true
              volumeMounts:
              - name: gcs-volume
                mountPath: /data
              - name: host-tmp
                mountPath: /tmp
          volumes:
          - name: gcs-volume
            csi:
              driver: gcsfuse.csi.storage.gke.io
              volumeAttributes:
                bucketName: torchprime
                mountOptions: "implicit-dirs"
          - name: host-tmp
            hostPath:
              path: /tmp
          nodeSelector:
            # Change this according to the TPU slice topology.
            cloud.google.com/gke-tpu-accelerator: tpu-v6e-slice
            cloud.google.com/gke-tpu-topology: 4x8  # v6e-32 chips
