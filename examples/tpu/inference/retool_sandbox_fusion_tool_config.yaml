# ReTool code-interpreter tool for run_qwen3_32b_retool_rollout.sh.
# Same as recipe/retool/sandbox_fusion_tool_config.yaml (askhat-g/verl-recipe) except for the URL: every node that
# runs the tool starts its own SandboxFusion server on port 18080 (recipe/retool/sandbox_fusion_tools.py), and on
# KubeRay port 8080 is taken by Ray's metrics exporter. This file is part of the checkout, so every node can read it.
tools:
  - class_name: "recipe.retool.retool.CustomSandboxFusionTool"
    config:
      sandbox_fusion_url: "http://127.0.0.1:18080/run_code"
      num_workers: 128
      enable_global_rate_limit: true
      rate_limit: 128
      default_timeout: 30
      default_language: "python"
      memory_limit_mb: 1024
      type: native

    tool_schema:
      type: "function"
      function:
        name: "code_interpreter"
        description: "A tool for executing code."
        parameters:
          type: "object"
          properties:
            code:
              type: "string"
              description: "The code to execute."
          required: ["code"]
