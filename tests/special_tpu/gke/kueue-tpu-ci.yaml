# Kueue admission queue for the verl TPU CI (GKE cluster `jialeic-ci-v6e8-2s-spot`).
#
# Every CI suite provisions its own short-lived RayCluster labelled with
# `kueue.x-k8s.io/queue-name: verl-tpu-ci`. Kueue keeps the RayCluster suspended (no pods
# are created) until the ClusterQueue has enough free TPU quota, then admits it as a
# whole (gang admission). Concurrent CI runs therefore queue in FIFO order instead of
# fighting over TPU hosts, and a half-scheduled cluster can never deadlock another one.
#
# The TPU quota (16 chips) matches the physical capacity of the node pools
# (2 x v6e-8 slices = 4 hosts x 4 chips). GKE only allows whole-host TPU requests
# (4 chips) on `tpu-v6e-slice` 2x4 nodes, so each CI RayCluster reserves one host.
#
# Applied idempotently by tests/special_tpu/run_tpu_e2e_ci.sh on every run:
#   kubectl apply -f tests/special_tpu/gke/kueue-tpu-ci.yaml
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: ResourceFlavor
metadata:
  name: verl-tpu-ci-v6e
spec:
  nodeLabels:
    cloud.google.com/gke-tpu-accelerator: tpu-v6e-slice
    cloud.google.com/gke-tpu-topology: 2x4
---
# Label-less flavor for CPU/memory so the Ray head pod (CPU only) is not pinned to TPU
# nodes and the TPU worker pods do not get an extra node selector.
apiVersion: kueue.x-k8s.io/v1beta1
kind: ResourceFlavor
metadata:
  name: verl-tpu-ci-default
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: ClusterQueue
metadata:
  name: verl-tpu-ci-cq
spec:
  namespaceSelector: {}
  queueingStrategy: BestEffortFIFO
  resourceGroups:
    - coveredResources: ["google.com/tpu"]
      flavors:
        - name: verl-tpu-ci-v6e
          resources:
            - name: google.com/tpu
              nominalQuota: 16
    - coveredResources: ["cpu", "memory"]
      flavors:
        - name: verl-tpu-ci-default
          resources:
            - name: cpu
              nominalQuota: 1000
            - name: memory
              nominalQuota: 4000Gi
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: LocalQueue
metadata:
  name: verl-tpu-ci
  namespace: default
spec:
  clusterQueue: verl-tpu-ci-cq
