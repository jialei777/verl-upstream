# Nightly GRPO run on 2 Cloud TPU v6e-4 slices (TPU counterpart of nightly_ascend.yml).
#
# Runs the Qwen3-4B GSM8K GRPO example of examples/tpu/grpo (torch.compile, splash attention, SimpleFSDP,
# tpu-sync weight sync) for GRPO_4B_STEPS steps with validation before and after training, and checks that
# GSM8K accuracy goes up. See tpu_unit_tests.yml and tests/special_tpu/README.md for how the TPU jobs work.
# The jobs only run in repositories that set the variable TPU_CI_RUNNER.
#
# It only runs on the nightly schedule or when started by hand (workflow_dispatch), never on pushes or PRs.
# GitHub runs `schedule` only from the default branch; on other branches start it by hand (Actions ->
# nightly_tpu -> Run workflow, or `gh workflow run nightly_tpu.yml --ref <branch>`).

name: nightly_tpu

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      verl_repo:
        description: "verl repository to test, e.g. a fork (empty: VERL_REPO in tests/special_tpu/gke/tpu-ci.env, verl-project/verl)"
        required: false
        default: ""
        type: string
      verl_commit:
        description: "verl full commit id, branch or tag to test (empty: VERL_COMMIT in tests/special_tpu/gke/tpu-ci.env, main)"
        required: false
        default: ""
        type: string
      steps:
        description: "Number of Qwen3-4B GRPO training steps"
        required: false
        default: "20"
        type: string
      plugin_repo:
        description: "verl-hardware-plugin repository, e.g. a fork (empty: VERL_HARDWARE_PLUGIN_REPO in tests/special_tpu/gke/tpu-ci.env)"
        required: false
        default: ""
        type: string
      plugin_commit:
        description: "verl-hardware-plugin full commit id, branch or tag (empty: VERL_HARDWARE_PLUGIN_COMMIT in tests/special_tpu/gke/tpu-ci.env)"
        required: false
        default: ""
        type: string

# One nightly run per ref at a time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Declare permissions just read content.
permissions:
  contents: read

env:
  # The self-hosted runners run as root.
  PIP_ROOT_USER_ACTION: ignore
  # Give up after waiting this long in the Kueue queue for TPU quota.
  QUEUE_TIMEOUT_MINS: "180"
  # Give up if the admitted RayCluster's pods are not all running after this long (TPU node scale-up, or
  # hosts still held by an earlier CI job).
  POD_READY_TIMEOUT_MINS: "60"
  GRPO_4B_STEPS: ${{ github.event.inputs.steps || '20' }}
  # Empty unless set by hand; the script then uses the plugin repository and commit pinned in tpu-ci.env.
  VERL_HARDWARE_PLUGIN_REPO: ${{ github.event.inputs.plugin_repo }}
  VERL_HARDWARE_PLUGIN_COMMIT: ${{ github.event.inputs.plugin_commit }}
  # Empty unless set by hand; the script then uses VERL_REPO / VERL_COMMIT in tpu-ci.env (verl-project/verl main).
  VERL_REPO: ${{ github.event.inputs.verl_repo }}
  VERL_COMMIT: ${{ github.event.inputs.verl_commit }}

jobs:
  build_image:
    if: vars.TPU_CI_RUNNER != ''
    name: Build the TPU CI image (examples/tpu/grpo/Dockerfile)
    runs-on: ${{ vars.TPU_CI_RUNNER }}
    timeout-minutes: 120
    outputs:
      image: ${{ steps.image.outputs.image }}
      verl_commit: ${{ steps.image.outputs.verl_commit }}
      plugin_commit: ${{ steps.image.outputs.plugin_commit }}
    steps:
      - name: Checkout verl
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build the image, or find it in Artifact Registry if this Dockerfile was built before
        id: image
        run: |
          bash tests/special_tpu/run_tpu_e2e_ci.sh build_image

  nightly_grpo_qwen3_4b_tpu:
    needs: build_image
    if: vars.TPU_CI_RUNNER != ''
    name: GSM8K GRPO Qwen3-4B on 2 x TPU v6e-4 (TorchTitan + vLLM, tpu-sync)
    runs-on: ${{ vars.TPU_CI_RUNNER }}
    timeout-minutes: 420 # Includes waiting for TPU quota (Kueue) and TPU hosts.
    env:
      # Resolved and built by the build_image job: the test runs exactly these commits on that image.
      TPU_CI_IMAGE: ${{ needs.build_image.outputs.image }}
      VERL_COMMIT: ${{ needs.build_image.outputs.verl_commit }}
      VERL_HARDWARE_PLUGIN_COMMIT: ${{ needs.build_image.outputs.plugin_commit }}
    steps:
      - name: Checkout verl
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install the Ray job CLI
        run: |
          python3 -m pip install --quiet "ray[default]==2.56.0"
      - name: Running Qwen3-4B GSM8K GRPO on 8 TPU v6e chips (examples/tpu/grpo/run_qwen3_4b_torchtitan.sh)
        run: |
          bash tests/special_tpu/run_tpu_e2e_ci.sh grpo_4b
      - name: Clean up the RayCluster
        if: always()
        run: |
          bash tests/special_tpu/run_tpu_e2e_ci.sh teardown grpo_4b
