# End-to-End TPU CI Workflow (SFT & GRPO on GKE Cloud TPU v6e-8 x2 Slices)
#
# Target GKE Cluster:
#   export CLUSTER_NAME="jialeic-ci-v6e8-2s-spot"
#   export REGION="us-central2"
#   export PROJECT="tpu-pytorch"
#   gcloud container clusters get-credentials $CLUSTER_NAME --region $REGION --project $PROJECT --dns-endpoint
#
# Mirrors `.github/workflows/e2e_sft_llm.yml` and `.github/workflows/e2e_v1_separate_async.yml`
# for Google Cloud TPU v6e (TorchTitan FSDP2 SFT + V1 Separate Async GRPO with vLLM-TPU).

name: e2e_tpu

on:
  workflow_dispatch:
    inputs:
      test_suite:
        description: "TPU E2E suite to execute (all, sft, or grpo)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - sft
          - grpo
      smoke_test:
        description: "Run fast CI smoke configuration (SMOKE_TEST=1)"
        required: false
        default: "1"
        type: choice
        options:
          - "1"
          - "0"
      runner_type:
        description: "GitHub runner label (self-hosted or ubuntu-latest)"
        required: false
        default: "self-hosted"
        type: string
  push:
    branches:
      - main
      - tpu-main*
      - tpu_sft
      - v0.*
    paths:
      - ".github/workflows/e2e_tpu.yml"
      - "examples/tpu/**"
      - "tests/special_tpu/**"
      - "verl/checkpoint_engine/**"
      - "verl/experimental/separation/**"
      - "verl/plugin/platform/**"
      - "verl/trainer/sft_trainer_ray.py"
      - "verl/trainer/main_ppo.py"
      - "verl/trainer/ppo/**"
      - "verl/trainer/config/**"
      - "verl/workers/engine_workers.py"
      - "verl/workers/engine/torchtitan/**"
      - "verl/workers/rollout/vllm_rollout/**"
      - "verl/workers/utils/**"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/e2e_tpu.yml"
      - "examples/tpu/**"
      - "tests/special_tpu/**"
      - "verl/checkpoint_engine/**"
      - "verl/experimental/separation/**"
      - "verl/plugin/platform/**"
      - "verl/trainer/sft_trainer_ray.py"
      - "verl/trainer/main_ppo.py"
      - "verl/trainer/ppo/**"
      - "verl/trainer/config/**"
      - "verl/workers/engine_workers.py"
      - "verl/workers/engine/torchtitan/**"
      - "verl/workers/rollout/vllm_rollout/**"
      - "verl/workers/utils/**"

# Scope concurrency per PR/branch so a new commit on the SAME PR cancels its own stale
# run, while multiple different PRs (#19, #20, #21...) NEVER cancel each other and
# instead queue in strict FIFO order on the single GKE runner (`replicas: 1`) and
# Kubernetes cluster lock (`tpu-ci-cluster-lock`).
concurrency:
  group: e2e-tpu-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/tpu-main') && github.ref != 'refs/heads/tpu_sft' }}

permissions:
  contents: read
  id-token: write

env:
  CLUSTER_NAME: "jialeic-ci-v6e8-2s-spot"
  REGION: "us-central2"
  PROJECT: "tpu-pytorch"
  RAY_CLUSTER_NAME: "ray-tpu-v6e-cluster"
  RAY_NAMESPACE: "default"
  SMOKE_TEST: ${{ github.event.inputs.smoke_test || '1' }}
  GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}

jobs:
  e2e_tpu:
    name: E2E TPU v6e SFT & GRPO (Qwen3-0.6B TorchTitan FSDP2 + vLLM V1)
    runs-on: ${{ github.event.inputs.runner_type || vars.TPU_CI_RUNNER || 'self-hosted' }}
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"

      - name: Authenticate to Google Cloud (Service Account Key or Workload Identity)
        if: ${{ env.GCP_SA_KEY != '' || env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK (when running outside GKE)
        if: ${{ env.GCP_SA_KEY != '' || env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: "gke-gcloud-auth-plugin,kubectl"

      - name: Install Ray Job Submission CLI & kubectl
        run: |
          if ! command -v kubectl >/dev/null 2>&1; then
            curl -sLO https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl
            chmod +x kubectl
            mv kubectl /usr/local/bin/kubectl
          fi
          python3 -m pip install --upgrade pip
          python3 -m pip install --quiet "ray[default]"

      - name: Connect to GKE TPU Cluster
        run: |
          if [[ -z "${KUBERNETES_SERVICE_HOST:-}" ]]; then
            export CLUSTER_NAME="jialeic-ci-v6e8-2s-spot"
            export REGION="us-central2"
            export PROJECT="tpu-pytorch"
            gcloud container clusters get-credentials $CLUSTER_NAME --region $REGION --project $PROJECT --dns-endpoint
          fi
          kubectl get nodes -o wide

      - name: Run GSM8K E2E SFT on TPU v6e-8 (TorchTitan FSDP2)
        if: ${{ (github.event_name != 'workflow_dispatch') || github.event.inputs.test_suite == 'all' || github.event.inputs.test_suite == 'sft' }}
        run: |
          bash tests/special_tpu/run_tpu_e2e_ci.sh sft

      - name: Reset KubeRay TPU Pods & Run GSM8K E2E GRPO on TPU v6e-8 x2 Slices
        if: ${{ (github.event_name != 'workflow_dispatch') || github.event.inputs.test_suite == 'all' || github.event.inputs.test_suite == 'grpo' }}
        run: |
          FORCE_POD_RESET=1 bash tests/special_tpu/run_tpu_e2e_ci.sh grpo
