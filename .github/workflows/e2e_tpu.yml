# End-to-End TPU CI Workflow (SFT & GRPO on GKE Cloud TPU v6e-8 x2 Slices)
#
# Target GKE Cluster:
#   export CLUSTER_NAME="jialeic-ci-v6e8-2s-spot"
#   export REGION="us-central2"
#   export PROJECT="tpu-pytorch"
#   gcloud container clusters get-credentials $CLUSTER_NAME --region $REGION --project $PROJECT --dns-endpoint
#
# Mirrors `.github/workflows/e2e_sft_llm.yml` and `.github/workflows/e2e_v1_separate_async.yml`
# for Google Cloud TPU v6e (TorchTitan FSDP2 SFT + V1 Separate Async GRPO with vLLM-TPU).

name: e2e_tpu

on:
  workflow_dispatch:
    inputs:
      test_suite:
        description: "TPU E2E suite to execute (all, sft, or grpo)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - sft
          - grpo
      smoke_test:
        description: "Run fast CI smoke configuration (SMOKE_TEST=1)"
        required: false
        default: "1"
        type: choice
        options:
          - "1"
          - "0"
      runner_type:
        description: "GitHub runner label (ubuntu-latest or self-hosted)"
        required: false
        default: "ubuntu-latest"
        type: string
  push:
    branches:
      - main
      - tpu-main*
      - v0.*
    paths:
      - ".github/workflows/e2e_tpu.yml"
      - "examples/tpu/**"
      - "tests/special_tpu/**"
      - "verl/checkpoint_engine/**"
      - "verl/experimental/separation/**"
      - "verl/plugin/platform/**"
      - "verl/trainer/sft_trainer_ray.py"
      - "verl/trainer/main_ppo.py"
      - "verl/trainer/ppo/**"
      - "verl/trainer/config/**"
      - "verl/workers/engine/torchtitan/**"
      - "verl/workers/rollout/vllm_rollout/**"
      - "verl/workers/utils/**"
  pull_request:
    branches:
      - main
      - tpu-main*
      - v0.*
    paths:
      - ".github/workflows/e2e_tpu.yml"
      - "examples/tpu/**"
      - "tests/special_tpu/**"
      - "verl/checkpoint_engine/**"
      - "verl/experimental/separation/**"
      - "verl/plugin/platform/**"
      - "verl/trainer/sft_trainer_ray.py"
      - "verl/trainer/main_ppo.py"
      - "verl/trainer/ppo/**"
      - "verl/trainer/config/**"
      - "verl/workers/engine/torchtitan/**"
      - "verl/workers/rollout/vllm_rollout/**"
      - "verl/workers/utils/**"

# Serialize runs targeting the same GKE TPU cluster so SFT and GRPO jobs
# never contend for the 16 TPU v6e chips on `jialeic-ci-v6e8-2s-spot`.
concurrency:
  group: tpu-ci-jialeic-ci-v6e8-2s-spot
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/tpu-main') }}

permissions:
  contents: read
  id-token: write

env:
  CLUSTER_NAME: "jialeic-ci-v6e8-2s-spot"
  REGION: "us-central2"
  PROJECT: "tpu-pytorch"
  RAY_CLUSTER_NAME: "ray-tpu-v6e-cluster"
  RAY_NAMESPACE: "default"
  SMOKE_TEST: ${{ inputs.smoke_test || '1' }}

jobs:
  e2e_sft_tpu:
    name: E2E TPU v6e SFT (Qwen3-0.6B TorchTitan FSDP2)
    if: ${{ (github.event_name != 'workflow_dispatch') || inputs.test_suite == 'all' || inputs.test_suite == 'sft' }}
    runs-on: ${{ inputs.runner_type || vars.TPU_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"

      - name: Authenticate to Google Cloud (Service Account Key or Workload Identity)
        if: ${{ secrets.GCP_SA_KEY != '' || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK & gke-gcloud-auth-plugin
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: "gke-gcloud-auth-plugin,kubectl"

      - name: Install Ray Job Submission CLI
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --quiet "ray[default]"

      - name: Connect to GKE TPU Cluster (${{ env.CLUSTER_NAME }})
        run: |
          export CLUSTER_NAME="jialeic-ci-v6e8-2s-spot"
          export REGION="us-central2"
          export PROJECT="tpu-pytorch"
          gcloud container clusters get-credentials $CLUSTER_NAME --region $REGION --project $PROJECT --dns-endpoint
          kubectl get nodes -o wide

      - name: Run GSM8K E2E SFT on TPU v6e-8 (TorchTitan FSDP2)
        run: |
          bash tests/special_tpu/run_tpu_e2e_ci.sh sft

  e2e_grpo_tpu:
    name: E2E TPU v6e GRPO (Qwen3-0.6B TorchTitan + vLLM V1 Separate Async)
    needs: [e2e_sft_tpu]
    if: ${{ !cancelled() && (needs.e2e_sft_tpu.result == 'success' || needs.e2e_sft_tpu.result == 'skipped') && ((github.event_name != 'workflow_dispatch') || inputs.test_suite == 'all' || inputs.test_suite == 'grpo') }}
    runs-on: ${{ inputs.runner_type || vars.TPU_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"

      - name: Authenticate to Google Cloud (Service Account Key or Workload Identity)
        if: ${{ secrets.GCP_SA_KEY != '' || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK & gke-gcloud-auth-plugin
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: "gke-gcloud-auth-plugin,kubectl"

      - name: Install Ray Job Submission CLI
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --quiet "ray[default]"

      - name: Connect to GKE TPU Cluster (${{ env.CLUSTER_NAME }})
        run: |
          export CLUSTER_NAME="jialeic-ci-v6e8-2s-spot"
          export REGION="us-central2"
          export PROJECT="tpu-pytorch"
          gcloud container clusters get-credentials $CLUSTER_NAME --region $REGION --project $PROJECT --dns-endpoint
          kubectl get nodes -o wide

      - name: Reset KubeRay TPU Pods & Run GSM8K E2E GRPO on TPU v6e-8 x2 Slices
        run: |
          kubectl delete pod -n "${RAY_NAMESPACE}" -l "ray.io/cluster=${RAY_CLUSTER_NAME}" --wait=true --timeout=180s || true
          bash tests/special_tpu/run_tpu_e2e_ci.sh grpo
