# End-to-End TPU CI Workflow (GKE Cloud TPU v6e, Qwen3-0.6B)
#
# Target GKE Cluster:
#   export CLUSTER_NAME="jialeic-ci-v6e8-2s-spot"
#   export REGION="us-central2"
#   export PROJECT="tpu-pytorch"
#   gcloud container clusters get-credentials $CLUSTER_NAME --region $REGION --project $PROJECT --dns-endpoint
#
# Three independent suites, each running as its own job with its own short-lived RayCluster:
#   smoke - 1 TPU chip  (1 x v6e-4 subslice): torch_tpu import / to(device) / matmul / autograd.
#   sft   - 4 TPU chips (1 x v6e-4 subslice): GSM8K SFT, TorchTitan FSDP2 (mirrors e2e_sft_llm.yml).
#   grpo  - 8 TPU chips (2 x v6e-4 subslices): GSM8K GRPO, 4-chip TorchTitan trainer + 4-chip
#                        vLLM rollout, V1 separate-async (mirrors e2e_v1_separate_async.yml).
# A single v6e host (4 chips) is the smallest multi-chip unit: libtpu cannot open an ICI session
# on a 2-chip subset of a host.
#
# tests/special_tpu/run_tpu_e2e_ci.sh provisions a RayCluster of single-host (2x2 subslices of
# the v6e-8 node pools) TPU workers per suite through the Kueue LocalQueue `verl-tpu-ci`, so
# concurrent jobs queue for TPU quota instead of fighting for hosts, runs the suite, and deletes
# the cluster on exit. The final `if: always()` step deletes it again in case the job was cancelled.

name: e2e_tpu

on:
  workflow_dispatch:
    inputs:
      test_suite:
        description: "TPU E2E suite to execute (all, smoke, sft, or grpo)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - smoke
          - sft
          - grpo
      smoke_test:
        description: "Run fast CI smoke configuration (SMOKE_TEST=1)"
        required: false
        default: "1"
        type: choice
        options:
          - "1"
          - "0"
      runner_type:
        description: "GitHub runner label (self-hosted or ubuntu-latest)"
        required: false
        default: "self-hosted"
        type: string
  push:
    branches:
      - main
      - tpu-main*
      - tpu_sft
      - v0.*
    paths:
      - ".github/workflows/e2e_tpu.yml"
      - "examples/tpu/**"
      - "tests/special_tpu/**"
      - "verl/checkpoint_engine/**"
      - "verl/experimental/separation/**"
      - "verl/plugin/platform/**"
      - "verl/trainer/sft_trainer_ray.py"
      - "verl/trainer/main_ppo.py"
      - "verl/trainer/ppo/**"
      - "verl/trainer/config/**"
      - "verl/workers/engine/torchtitan/**"
      - "verl/workers/rollout/vllm_rollout/**"
      - "verl/workers/utils/**"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/e2e_tpu.yml"
      - "examples/tpu/**"
      - "tests/special_tpu/**"
      - "verl/checkpoint_engine/**"
      - "verl/experimental/separation/**"
      - "verl/plugin/platform/**"
      - "verl/trainer/sft_trainer_ray.py"
      - "verl/trainer/main_ppo.py"
      - "verl/trainer/ppo/**"
      - "verl/trainer/config/**"
      - "verl/workers/engine/torchtitan/**"
      - "verl/workers/rollout/vllm_rollout/**"
      - "verl/workers/utils/**"

# A new commit on the same PR cancels its own stale run (its RayClusters are torn down by
# the always() step). Different PRs never cancel each other; their RayClusters wait in the
# Kueue queue until TPU quota frees up.
concurrency:
  group: e2e-tpu-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/tpu-main') && github.ref != 'refs/heads/tpu_sft' }}

permissions:
  contents: read
  id-token: write

env:
  CLUSTER_NAME: "jialeic-ci-v6e8-2s-spot"
  REGION: "us-central2"
  PROJECT: "tpu-pytorch"
  RAY_NAMESPACE: "default"
  KUEUE_QUEUE: "verl-tpu-ci"
  QUEUE_TIMEOUT_MINS: "90"
  SMOKE_TEST: ${{ github.event.inputs.smoke_test || '1' }}
  GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}

jobs:
  select_suites:
    name: Select TPU suites
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.select.outputs.suites }}
    steps:
      - id: select
        run: |
          case "${{ github.event.inputs.test_suite || 'all' }}" in
            all) echo 'suites=["smoke","sft","grpo"]' >> "${GITHUB_OUTPUT}" ;;
            *) echo 'suites=["${{ github.event.inputs.test_suite }}"]' >> "${GITHUB_OUTPUT}" ;;
          esac

  e2e_tpu:
    name: E2E TPU v6e ${{ matrix.suite }}
    needs: select_suites
    runs-on: ${{ github.event.inputs.runner_type || vars.TPU_CI_RUNNER || 'self-hosted' }}
    # Includes up to QUEUE_TIMEOUT_MINS of waiting in the Kueue queue for TPU quota.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.select_suites.outputs.suites) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"

      - name: Authenticate to Google Cloud (Service Account Key or Workload Identity)
        if: ${{ env.GCP_SA_KEY != '' || env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK (when running outside GKE)
        if: ${{ env.GCP_SA_KEY != '' || env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: "gke-gcloud-auth-plugin,kubectl"

      - name: Install Ray Job Submission CLI & kubectl
        run: |
          if ! command -v kubectl >/dev/null 2>&1; then
            curl -sLO https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl
            chmod +x kubectl
            mv kubectl /usr/local/bin/kubectl
          fi
          python3 -m pip install --upgrade pip
          python3 -m pip install --quiet "ray[default]"

      - name: Provision RayCluster, run ${{ matrix.suite }} suite, tear down
        run: bash tests/special_tpu/run_tpu_e2e_ci.sh ${{ matrix.suite }}

      - name: Tear down RayCluster (safety net for cancelled or crashed runs)
        if: ${{ always() }}
        run: bash tests/special_tpu/run_tpu_e2e_ci.sh teardown ${{ matrix.suite }}
