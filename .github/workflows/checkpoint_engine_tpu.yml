# tpu-sync weight sync on 2 Cloud TPU v6e-4 slices (TPU counterpart of the checkpoint engine tests in
# tests/checkpoint_engine).
#
# Runs tests/special_tpu/tpu_sync_test.py: a TorchTitan trainer (Qwen3-0.6B, configured as the GRPO actor) on one
# v6e-4 slice sends its weights through the verl-hardware-plugin tpu-sync checkpoint engine to fake single-chip rollout workers on the
# other slice, which run the plugin's sampler-side code without vLLM and compare every received tensor bit for bit
# with its tensor-parallel slice of the checkpoint (1 x TP4, 2 x TP2, TP4 keeping the send buffers; 3 syncs each).
# See tpu_unit_tests.yml and tests/special_tpu/README.md for how the TPU jobs work. The jobs only run in repositories
# that set the variable TPU_CI_RUNNER.

name: checkpoint_engine_tpu

on:
  push:
    branches:
      - main
      - main-ci
      - v0.*
    paths:
      - "verl/checkpoint_engine/**"
      - "verl/workers/engine/**"
      - "verl/workers/rollout/**"
      - "verl/workers/engine_workers.py"
      - "verl/single_controller/**"
      # Not used on TPU
      - "!verl/workers/engine/automodel/**"
      - "!verl/workers/engine/megatron/**"
      - "!verl/workers/engine/mindspeed/**"
      - "!verl/workers/engine/veomni/**"
      - "!verl/workers/rollout/sglang_rollout/**"
      - "!verl/workers/rollout/trtllm_rollout/**"
      # Entrypoints
      - "examples/tpu/grpo/Dockerfile"
      - "tests/special_tpu/**"
      - "!**/*.md"
      - ".github/workflows/checkpoint_engine_tpu.yml"
  pull_request:
    branches:
      - main
      - main-ci
      - v0.*
    paths:
      - "verl/checkpoint_engine/**"
      - "verl/workers/engine/**"
      - "verl/workers/rollout/**"
      - "verl/workers/engine_workers.py"
      - "verl/single_controller/**"
      # Not used on TPU
      - "!verl/workers/engine/automodel/**"
      - "!verl/workers/engine/megatron/**"
      - "!verl/workers/engine/mindspeed/**"
      - "!verl/workers/engine/veomni/**"
      - "!verl/workers/rollout/sglang_rollout/**"
      - "!verl/workers/rollout/trtllm_rollout/**"
      # Entrypoints
      - "examples/tpu/grpo/Dockerfile"
      - "tests/special_tpu/**"
      - "!**/*.md"
      - ".github/workflows/checkpoint_engine_tpu.yml"
  workflow_dispatch:
    inputs:
      verl_repo:
        description: "verl repository to test, e.g. a fork (empty: VERL_REPO in tests/special_tpu/gke/tpu-ci.env, verl-project/verl)"
        required: false
        default: ""
        type: string
      verl_commit:
        description: "verl full commit id, branch or tag to test (empty: VERL_COMMIT in tests/special_tpu/gke/tpu-ci.env, main)"
        required: false
        default: ""
        type: string
      plugin_repo:
        description: "verl-hardware-plugin repository, e.g. a fork (empty: VERL_HARDWARE_PLUGIN_REPO in tests/special_tpu/gke/tpu-ci.env)"
        required: false
        default: ""
        type: string
      plugin_commit:
        description: "verl-hardware-plugin full commit id, branch or tag (empty: VERL_HARDWARE_PLUGIN_COMMIT in tests/special_tpu/gke/tpu-ci.env)"
        required: false
        default: ""
        type: string

# Cancel jobs on the same ref if a new one is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/main-ci' }}

# Declare permissions just read content.
permissions:
  contents: read

env:
  # The self-hosted runners run as root.
  PIP_ROOT_USER_ACTION: ignore
  # Give up after waiting this long in the Kueue queue for TPU quota.
  QUEUE_TIMEOUT_MINS: "90"
  # Give up if the admitted RayCluster's pods are not all running after this long (TPU node scale-up, or
  # hosts still held by an earlier CI job).
  POD_READY_TIMEOUT_MINS: "60"
  # Empty unless set by hand; the script then uses the plugin repository and commit pinned in tpu-ci.env.
  VERL_HARDWARE_PLUGIN_REPO: ${{ github.event.inputs.plugin_repo }}
  VERL_HARDWARE_PLUGIN_COMMIT: ${{ github.event.inputs.plugin_commit }}
  # Empty unless set by hand; the script then uses VERL_REPO / VERL_COMMIT in tpu-ci.env (verl-project/verl main).
  VERL_REPO: ${{ github.event.inputs.verl_repo }}
  VERL_COMMIT: ${{ github.event.inputs.verl_commit }}

jobs:
  build_image:
    if: vars.TPU_CI_RUNNER != ''
    name: Build the TPU CI image (examples/tpu/grpo/Dockerfile)
    runs-on: ${{ vars.TPU_CI_RUNNER }}
    timeout-minutes: 120
    outputs:
      image: ${{ steps.image.outputs.image }}
      verl_commit: ${{ steps.image.outputs.verl_commit }}
      plugin_commit: ${{ steps.image.outputs.plugin_commit }}
    steps:
      - name: Checkout verl
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build the image, or find it in Artifact Registry if this Dockerfile was built before
        id: image
        run: |
          bash tests/special_tpu/run_tpu_e2e_ci.sh build_image

  checkpoint_engine_tpu:
    needs: build_image
    if: vars.TPU_CI_RUNNER != ''
    name: tpu-sync weight sync Qwen3-0.6B on 2 x TPU v6e-4 (TorchTitan trainer -> fake rollout workers, bit-exact)
    runs-on: ${{ vars.TPU_CI_RUNNER }}
    timeout-minutes: 240 # Includes waiting for TPU quota (Kueue) and TPU hosts.
    env:
      # Resolved and built by the build_image job: the test runs exactly these commits on that image.
      TPU_CI_IMAGE: ${{ needs.build_image.outputs.image }}
      VERL_COMMIT: ${{ needs.build_image.outputs.verl_commit }}
      VERL_HARDWARE_PLUGIN_COMMIT: ${{ needs.build_image.outputs.plugin_commit }}
    steps:
      - name: Checkout verl
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install the Ray job CLI
        run: |
          python3 -m pip install --quiet "ray[default]==2.56.0"
      - name: Running the tpu-sync weight sync test on 8 TPU v6e chips (tests/special_tpu/tpu_sync_test.py)
        run: |
          bash tests/special_tpu/run_tpu_e2e_ci.sh tpu_sync
      - name: Clean up the RayCluster
        if: always()
        run: |
          bash tests/special_tpu/run_tpu_e2e_ci.sh teardown tpu_sync
